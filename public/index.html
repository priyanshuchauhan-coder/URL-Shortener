<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Simple URL Shortener</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <nav class="navbar bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">Slinkify</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">Home</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="#">Dashboard</a>
              </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>
            </ul>
          </div>
        </div>
    </nav>
  <div class="container">
    <div class="logo">🧭</div>
    <h1 class="title">URL Shortener</h1>
    
    <div class="input-group">
      <input type="url" id="longUrl" placeholder="Paste a URL" />
      <button onclick="shortenUrl()">Shorten</button>
    </div>

    <div id="result" class="result hidden">
      <p>Shortened URL: <a id="shortenedLink" href="#" target="_blank"></a></p>
      <button class="copy-btn" onclick="copyToClipboard()">Copy</button>
    </div>
  </div>

  <script>
    async function shortenUrl() {
      const longUrlInput = document.getElementById('longUrl');
      const resultDiv = document.getElementById('result');
      const shortenedLink = document.getElementById('shortenedLink');
      const longUrl = longUrlInput.value;

      if (longUrl) {
        const response = await fetch('/shorten', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({ longUrl }),
        });

        const data = await response.json();

        if (data.shortUrl) {
          shortenedLink.textContent = data.shortUrl;
          shortenedLink.href = data.shortUrl;
          resultDiv.classList.remove('hidden');
          longUrlInput.value = '';
        } else {
          alert(data.error || 'An error occurred while shortening the URL.');
        }
      } else {
        alert('Please enter a URL to shorten.');
      }
    }

    function copyToClipboard() {
      const shortenedLink = document.getElementById('shortenedLink').textContent;
      navigator.clipboard.writeText(shortenedLink)
        .then(() => alert('Copied to clipboard!'))
        .catch(err => alert('Failed to copy: ' + err));
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
